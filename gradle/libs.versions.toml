########################################################################
# Version catalog.
#
# Every version here was resolved from live Maven metadata (Google Maven
# / Maven Central) rather than copied from documentation. Two pairings
# are load-bearing and must be changed together:
#
#   kotlin <-> ksp        KSP tracks the Kotlin minor version. As of this
#                         writing the newest KSP is 2.3.11, so Kotlin is
#                         pinned to 2.3.21 even though 2.4.10 is stable.
#                         Bumping Kotlin to 2.4.x strands Room and Hilt,
#                         both of which run through KSP.
#
#   agp <-> compileSdk    AGP 9.3.1 is the newest stable and supports the
#                         installed platform (android-37).
########################################################################

[versions]
# --- build ---
agp = "9.3.2"
kotlin = "2.4.10"
ksp = "2.3.11"
# --- sdk ---
compileSdk = "37"
targetSdk = "36"
# Android 15. This is a new app for modern devices with a small user base, so the
# floor is set at the platform the design language actually assumes rather than at
# the widest reach — but it is set at the *lowest* platform that assumes it, which
# is 35 rather than 36.
#
# It was 36, and nothing the app is built on needed that. Every capability the
# design language rests on arrived earlier and is still unconditionally present
# here: dynamic colour is 31, per-app language and predictive back are 33,
# edge-to-edge enforcement follows `targetSdk` 35+ and so applies unchanged, and
# `java.time` has been available since 26. So the trade 36 was making — install
# base for simplicity — was buying no simplicity that 35 does not also buy.
#
# The invariant it exists to support is unchanged and still binding: no
# `Build.VERSION.SDK_INT` guards. A guard below the floor is a branch no supported
# device can take, so it cannot be exercised and rots silently. Lowering the floor
# moves the line; it does not introduce guards above it. If something genuinely
# needs an API newer than this, raise the floor rather than branch under it.
minSdk = "35"
# --- androidx / compose ---
composeBom = "2026.08.00"
# material3 is pinned ABOVE the BOM on purpose. The BOM resolves 1.4.0, and the
# whole Material 3 Expressive surface -- MaterialShapes, LoadingIndicator,
# ButtonGroup, FloatingToolbar, SplitButton, FloatingActionButtonMenu, the wavy
# progress indicators, MotionScheme and MaterialExpressiveTheme -- is either
# absent from 1.4.0 or `internal` there, so none of it can be used. Expressive is
# the design language this app is being built in, so the alpha is the only way to
# get it. It costs less than it looks: 1.5.0-alpha26 requires compose
# 1.12.0-beta01 and the BOM already supplies 1.12.0 stable, so nothing else moves.
# See docs/API-GROUND-TRUTH.md.
material3 = "1.5.0-alpha26"
m3Adaptive = "1.3.0"
activityCompose = "1.13.0"
coreKtx = "1.19.0"
splashscreen = "1.2.0"
startup = "1.2.0"
lifecycle = "2.11.0"
navigationCompose = "2.9.8"
datastore = "1.2.1"
paging = "3.5.1"
work = "2.11.2"
glance = "1.1.1"
# --- persistence ---
room = "2.8.4"
sqlite = "2.7.0"
# --- di ---
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
# --- kotlinx ---
coroutines = "1.11.0"
serialization = "1.11.0"
# --- network / images ---
okhttp = "5.4.0"
coil = "3.5.0"
# --- rendering ---
filament = "1.75.1"
# graphics-shapes is the library `MaterialShapes` is built on. That catalogue is
# absent from material3 1.4.0 (see docs/API-GROUND-TRUTH.md), but the primitives
# -- RoundedPolygon, Morph -- are public and stable here, so the design system
# defines the few shapes it actually uses instead of importing forty.
graphicsShapes = "1.1.0"
# --- etl (jvm tool, never shipped) ---
sqliteJdbc = "3.53.2.1"
kotlinCsv = "1.10.0"
# --- test ---
junit4 = "4.13.2"
junit5 = "6.1.3"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"
uiautomator = "2.4.0"
kotest = "6.2.4"
turbine = "1.2.1"
robolectric = "4.16.1"
roborazzi = "1.73.0"
# benchmark also versions the `androidx.baselineprofile` Gradle plugin, published
# from the same release train, so the two move together or not at all.
#
# This is an rc rather than the 1.4.1 stable because 1.4.1 does not work here.
# Applied to `:app` on AGP 9.3.1 its plugin dies at apply time with "Module `:app`
# is not a supported android module" — it looks up `androidComponents` by type and
# comes back empty against AGP 9, which is a version gap and not a mistake in this
# build: the extension is registered, and a probe in the same build script finds
# it. 1.5.0-rc01 applies cleanly and creates the expected variants. Staying on
# 1.4.1 for the library while taking the rc for the plugin is not an option,
# because the two share internal contracts.
benchmark = "1.5.0-rc01"
profileinstaller = "1.4.1"

[libraries]
# --- compose (versions come from the BOM) ---
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "m3Adaptive" }
compose-material3-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout", version.ref = "m3Adaptive" }
compose-material3-adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "m3Adaptive" }
compose-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }

# --- androidx core ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-startup = { group = "androidx.startup", name = "startup-runtime", version.ref = "startup" }
# Already present transitively via Compose, but declared: it is what actually
# applies the baseline profile on first run, so the profile is worthless without
# it. A load-bearing dependency should not arrive by accident from someone else's
# POM that is free to drop it.
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }
androidx-work-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }

# --- room / sqlite ---
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }

# --- di ---
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# --- kotlinx ---
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# --- network / images ---
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3-junit4", version.ref = "okhttp" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }

# --- rendering ---
filament-android = { group = "com.google.android.filament", name = "filament-android", version.ref = "filament" }
filament-utils-android = { group = "com.google.android.filament", name = "filament-utils-android", version.ref = "filament" }
androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphicsShapes" }

# --- etl tool (jvm only, never on the app classpath) ---
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
kotlin-csv-jvm = { group = "com.github.doyaaaaaken", name = "kotlin-csv-jvm", version.ref = "kotlinCsv" }

# --- test ---
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
junit5-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit5" }
junit5-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine" }
junit5-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
# Android library modules need the JUnit 5 variant named explicitly. In a JVM
# module, `kotlin-test` resolves its framework variant from the test task's
# platform, so plain `kotlin-test` yields `kotlin.test.Test`. Android unit tests
# resolve through a different variant and land on the JUnit 4 mapping instead,
# where `kotlin.test.Test` is simply absent -- an unresolved reference rather than
# a helpful error.
kotlin-test-junit5 = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5", version.ref = "kotlin" }
kotest-property = { group = "io.kotest", name = "kotest-property", version.ref = "kotest" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }

# --- referenced by build-logic convention plugins ---
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
room-gradle-plugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
