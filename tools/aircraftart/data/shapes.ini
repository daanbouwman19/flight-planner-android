# Every distinct outline in the seed fleet, how to build it, and which seed rows
# it draws.
#
#   [shape_id]              lower snake case; becomes the id in AircraftShapes.kt
#   label = â¦               what the contact sheet calls it
#   provenance = â¦          Traced (default), Drawn, or Fallback
#   model = â¦               a glTF under the sim root; repeat to draw several together
#                           (an airframe, its engines, its wing tips)
#   include / exclude = â¦   regexes over node paths ("parent/child/node")
#   span / length = â¦       published figures in metres; the traced outline must
#                           match within `tolerance` per cent (default 2)
#   figures = â¦             where span and length come from
#   extra = â¦               prop(x,z,d) / rotor(x,z,d) in model metres, noautoprops
#   drawn = â¦               for Drawn: the file under data/drawn/
#   fallback = â¦            for Fallback: a category this outline stands in for
#   row = Manufacturer / Variant    a seed row drawn with this outline; repeat
#
# Model paths are relative to the simulator's package root (--sim-root).
# Variants that look the same from directly above share an outline: cabin
# layouts, freighter conversions without a changed planform, avionics fits.

